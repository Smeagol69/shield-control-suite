[versions]
agp = "9.3.0"
kotlin = "2.4.10"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
tv-material = "1.1.0"
tv-foundation = "1.0.0"
coroutines = "1.11.0"
libxposed = "102.0.0"
beanshell = "2.0b5"
junit = "4.13.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv-material" }
tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tv-foundation" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposed" }
beanshell = { group = "org.beanshell", name = "bsh", version.ref = "beanshell" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
