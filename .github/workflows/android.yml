name: Android verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test, lint, and build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :modules:shield-hooks:testDebugUnitTest \
            :apps:marquee-compose:testDebugUnitTest \
            :modules:shield-hooks:lintDebug \
            :apps:marquee-compose:lintDebug \
            :modules:shield-hooks:assembleDebug \
            :apps:marquee-compose:assembleDebug
